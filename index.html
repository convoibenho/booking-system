<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đăng ký Phòng & Vật tư</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🏢 Hệ Thống Đăng Ký Phòng & Vật Tư</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">Trực tuyến</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Form Đăng ký -->
        <section class="bg-white p-6 rounded-xl shadow-md md:col-span-1">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">📝 Tạo Đăng Ký Mới</h2>
            <form id="bookingForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Họ và tên người đăng ký</label>
                    <input type="text" id="fullName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nhập tên của bạn">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Loại tài nguyên</label>
                    <select id="resourceType" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Phòng họp / Phòng học">Phòng họp / Phòng học</option>
                        <option value="Thiết bị / Vật tư (Máy chiếu, Micro...)">Thiết bị / Vật tư (Máy chiếu, Micro...)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên Phòng / Vật tư cụ thể</label>
                    <input type="text" id="resourceName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ví dụ: Phòng A201 hoặc Máy chiếu số 02">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Thời gian bắt đầu</label>
                        <input type="datetime-local" id="startTime" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Thời gian kết thúc</label>
                        <input type="datetime-local" id="endTime" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mục đích sử dụng</label>
                    <textarea id="purpose" rows="2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nhập mục đích..."></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Gửi Đăng Ký</button>
            </form>
        </section>

        <!-- Danh sách đã đăng ký -->
        <section class="bg-white p-6 rounded-xl shadow-md md:col-span-2">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">📊 Danh Sách Đã Đăng Ký</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3">Người đăng ký</th>
                            <th class="p-3">Tài nguyên</th>
                            <th class="p-3">Thời gian</th>
                            <th class="p-3">Mục đích</th>
                            <th class="p-3 text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTableBody" class="text-sm text-gray-700 divide-y">
                        <!-- Dữ liệu sẽ được chèn tự động bằng JavaScript -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="text-center py-8 text-gray-400">Chưa có lịch đăng ký nào được tạo.</div>
        </section>

    </main>

    <!-- JavaScript Xử lý -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('bookingForm');
            const tableBody = document.getElementById('bookingTableBody');
            const emptyState = document.getElementById('emptyState');

            let bookings = JSON.parse(localStorage.getItem('bookings')) || [];

            function renderBookings() {
                tableBody.innerHTML = '';
                if (bookings.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }
                emptyState.style.display = 'none';

                bookings.forEach((item, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="p-3 font-medium">${item.fullName}</td>
                        <td class="p-3">
                            <span class="font-semibold">${item.resourceName}</span><br>
                            <span class="text-xs text-gray-500">${item.resourceType}</span>
                        </td>
                        <td class="p-3 text-xs">
                            Từ: ${item.startTime.replace('T', ' ')}<br>
                            Đến: ${item.endTime.replace('T', ' ')}
                        </td>
                        <td class="p-3">${item.purpose || 'Không có'}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteBooking(${index})" class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded border border-red-200">Xóa</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const newBooking = {
                    fullName: document.getElementById('fullName').value,
                    resourceType: document.getElementById('resourceType').value,
                    resourceName: document.getElementById('resourceName').value,
                    startTime: document.getElementById('startTime').value,
                    endTime: document.getElementById('endTime').value,
                    purpose: document.getElementById('purpose').value
                };

                // Kiểm tra logic thời gian đơn giản
                if (newBooking.startTime >= newBooking.endTime) {
                    alert('Thời gian kết thúc phải lớn hơn thời gian bắt đầu!');
                    return;
                }

                bookings.push(newBooking);
                localStorage.setItem('bookings', JSON.stringify(bookings));
                renderBookings();
                form.reset();
                alert('Đăng ký thành công!');
            });

            window.deleteBooking = function(index) {
                if (confirm('Bạn có chắc chắn muốn hủy lượt đăng ký này không?')) {
                    bookings.splice(index, 1);
                    localStorage.setItem('bookings', JSON.stringify(bookings));
                    renderBookings();
                }
            };

            renderBookings();
        });
    </script>
</body>
</html>
